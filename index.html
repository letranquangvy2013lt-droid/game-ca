
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thế Giới Cá Mập</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#002c50;color:white;text-align:center}
.screen{display:none;min-height:100vh;padding:20px}
.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
#lobby{background:radial-gradient(circle at 50% 80%,#16bfd0,#00618e 55%,#001b46)}
h1{font-size:clamp(30px,6vw,52px);color:#ffe66d;text-shadow:3px 3px #00334d}
button{border:0;border-radius:13px;padding:13px 22px;margin:7px;background:#ffc342;color:#17304b;font-weight:bold;font-size:17px;cursor:pointer}
button:hover{background:#ffe58a}
#game{justify-content:flex-start;background:linear-gradient(#006c92,#002747)}
#hud{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;margin:10px;font-size:17px}
canvas{width:min(95vw,900px);height:auto;border:4px solid #8deaff;border-radius:12px;background:#42b9d4;touch-action:none}
#message{font-size:21px;color:#ffe66d;min-height:30px;margin:8px}
#result{position:fixed;inset:0;background:#001c46eF;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5;padding:20px}
#result h2{font-size:clamp(30px,7vw,55px);color:#ffe66d}
#result p{font-size:22px}
.small{font-size:14px;color:#d8f7ff}
</style>
</head>
<body>

<section id="lobby" class="screen active">
<h1>🐟 THẾ GIỚI CÁ MẬP 🦈</h1>
<p>Hãy ăn cá bé để trở thành vua đại dương!</p>
<div style="font-size:65px;margin:20px">🐠 🐟 🐡 🦈</div>
<button id="startBtn">▶ BẮT ĐẦU</button>
<button id="helpBtn">📖 HƯỚNG DẪN</button>
<p class="small">Di chuyển bằng WASD, phím mũi tên hoặc chuột.</p>
</section>

<section id="game" class="screen">
<h2>🌊 ĐẠI DƯƠNG</h2>
<div id="hud">
<span>⭐ Điểm: <b id="score">0</b></span>
<span>❤️ Mạng: <b id="lives">4</b></span>
<span>📏 Cỡ cá: <b id="size">1</b></span>
<span>⏱️ <b id="timer">05:00</b></span>
</div>
<canvas id="canvas" width="900" height="520"></canvas>
<div id="message">Ăn cá nhỏ để lớn lên!</div>
<div>
<button id="pauseBtn">⏸ TẠM DỪNG</button>
<button id="restartBtn">🔄 CHƠI LẠI</button>
<button id="homeBtn">🏠 SẢNH CHỜ</button>
</div>
<p class="small">Tránh cá tím khổng lồ và bom nhé!</p>
</section>

<div id="result">
<h2 id="resultTitle">🏆 CHIẾN THẮNG!</h2>
<p id="resultText"></p>
<button id="playAgain">🔄 CHƠI LẠI</button>
<button id="resultHome">🏠 VỀ SẢNH</button>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const canvas=$("canvas"),ctx=canvas.getContext("2d");
const lobby=$("lobby"),game=$("game"),result=$("result");
const keys={};
let player,fish=[],bombs=[],particles=[];
let score=0,lives=4,timeLeft=300;
let running=false,paused=false,last=0,raf=0;
let messageTimer=0;
const pointer={x:450,y:260,active:false};

function screen(which){
 lobby.classList.remove("active");
 game.classList.remove("active");
 if(which==="lobby")lobby.classList.add("active");
 if(which==="game")game.classList.add("active");
}

function rand(min,max){return Math.random()*(max-min)+min}

function makeFish(big=false){
 return {
  x:rand(30,870),y:rand(40,480),
  r:big?rand(47,58):rand(12,24),
  speed:big?rand(45,75):rand(35,100),
  dir:Math.random()<.5?-1:1,
  color:big?"#9b48df":["#ffcb45","#ff798d","#9eea72","#f4a4ff","#ffffff"][Math.floor(Math.random()*5)],
  big
 };
}

function makeBomb(){
 return {x:rand(50,850),y:rand(50,470),r:19,phase:rand(0,6)};
}

function reset(){
 cancelAnimationFrame(raf);
 player={x:450,y:260,r:22,speed:220};
 fish=[];
 bombs=[];
 particles=[];
 for(let i=0;i<22;i++)fish.push(makeFish());
 for(let i=0;i<2;i++)fish.push(makeFish(true));
 for(let i=0;i<5;i++)bombs.push(makeBomb());
 score=0;lives=4;timeLeft=300;
 running=true;paused=false;last=performance.now();
 pointer.active=false;
 $("pauseBtn").textContent="⏸ TẠM DỪNG";
 $("message").textContent="Ăn cá nhỏ để lớn lên!";
 result.style.display="none";
 hud();
 screen("game");
 raf=requestAnimationFrame(loop);
}

function hud(){
 $("score").textContent=score;
 $("lives").textContent=lives;
 $("size").textContent=(player.r/22).toFixed(1);
 const t=Math.max(0,Math.ceil(timeLeft));
 $("timer").textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}

function say(text){
 $("message").textContent=text;
 messageTimer=2;
}

function finish(won){
 if(!running)return;
 running=false;
 cancelAnimationFrame(raf);
 $("resultTitle").textContent=won?"🏆 CHIẾN THẮNG!":"💔 GAME OVER!";
 $("resultText").textContent=won?
 "Bạn đã sống sót đủ 5 phút và trở thành vua đại dương! Điểm: "+score:
 "Bạn đã hết 4 mạng. Điểm của bạn: "+score;
 result.style.display="flex";
 if(won){
  for(let i=0;i<160;i++){
   particles.push({x:rand(0,900),y:rand(-500,0),vx:rand(-80,80),vy:rand(50,180),life:5,color:["#ffe66d","#ff6b9b","#73f5e6","#ffffff"][i%4],r:rand(3,7)});
  }
  // Confetti is displayed on the victory screen.
  drawConfetti();
 }
}

function drawConfetti(){
 ctx.clearRect(0,0,900,520);
 ctx.fillStyle="#063e67";ctx.fillRect(0,0,900,520);
 for(let i=0;i<particles.length;i++){
  const p=particles[i];
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,p.r,p.r*1.8);
 }
}

function loseLife(){
 lives--;
 player.x=450;player.y=260;
 say("⚠️ Bạn mất một mạng!");
 if(lives<=0){hud();finish(false);}
}

function explode(x,y){
 for(let i=0;i<45;i++){
  const a=Math.random()*Math.PI*2;
  const speed=rand(60,260);
  particles.push({
   x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
   life:rand(.4,.9),max:.9,r:rand(3,9),
   color:["#ffdf45","#ff792e","#ff3737","#fff2a0"][i%4]
  });
 }
 say("💥 BÙM! Bom phát nổ!");
}

function drawFish(f){
 ctx.save();
 ctx.translate(f.x,f.y);
 if(f.dir<0)ctx.scale(-1,1);
 ctx.fillStyle=f.color;
 ctx.beginPath();
 ctx.ellipse(0,0,f.r*1.3,f.r*.8,0,0,Math.PI*2);
 ctx.fill();
 ctx.beginPath();
 ctx.moveTo(-f.r,0);
 ctx.lineTo(-f.r*1.8,-f.r*.7);
 ctx.lineTo(-f.r*1.8,f.r*.7);
 ctx.closePath();ctx.fill();
 ctx.fillStyle="#162b42";
 ctx.beginPath();ctx.arc(f.r*.7,-f.r*.2,Math.max(2,f.r*.11),0,Math.PI*2);ctx.fill();
 if(f.big){
  ctx.fillStyle="#ffe9ff";ctx.font="bold 15px Arial";
  ctx.fillText("KHỔNG LỒ",-f.r,-f.r-9);
 }
 ctx.restore();
}

function drawBomb(b){
 const pulse=1+Math.sin(b.phase)*.08;
 ctx.save();ctx.translate(b.x,b.y);ctx.scale(pulse,pulse);
 ctx.fillStyle="#263b4b";
 ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#d3e6f3";ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(-5,-5,5,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle="#ffdc45";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(5,-b.r+3);ctx.lineTo(12,-b.r-9);ctx.stroke();
 ctx.fillStyle="#ff553c";
 ctx.beginPath();ctx.arc(13,-b.r-10,4,0,Math.PI*2);ctx.fill();
 ctx.restore();
}

function drawPlayer(){
 drawFish({...player,color:"#ff9e32",dir:1});
}

function update(dt){
 timeLeft-=dt;
 if(timeLeft<=0){
  timeLeft=0;hud();finish(true);return;
 }

 let dx=0,dy=0;
 if(keys.ArrowLeft||keys.a)dx--;
 if(keys.ArrowRight||keys.d)dx++;
 if(keys.ArrowUp||keys.w)dy--;
 if(keys.ArrowDown||keys.s)dy++;

 if(pointer.active){
  const px=pointer.x-player.x,py=pointer.y-player.y;
  const d=Math.hypot(px,py);
  if(d>10){dx=px/d;dy=py/d;}
  else{dx=0;dy=0;}
 }
 const len=Math.hypot(dx,dy);
 if(len>0){
  player.x+=dx/len*player.speed*dt;
  player.y+=dy/len*player.speed*dt;
 }
 player.x=Math.max(player.r,Math.min(900-player.r,player.x));
 player.y=Math.max(player.r,Math.min(520-player.r,player.y));

 for(let i=fish.length-1;i>=0;i--){
  const f=fish[i];
  f.x+=f.speed*f.dir*dt;
  if(f.x<f.r*2||f.x>900-f.r*2)f.dir*=-1;
  if(Math.hypot(player.x-f.x,player.y-f.y)<player.r+f.r*.7){
   if(player.r>f.r*.9){
    score+=f.big?50:10;
    player.r=Math.min(75,player.r+(f.big?2:1));
    fish.splice(i,1);
    fish.push(makeFish());
    say("⭐ Bạn đã ăn được cá! + điểm");
   }else if(f.big){
    loseLife();
    fish.splice(i,1);fish.push(makeFish(true));
   }
  }
 }
 for(let i=bombs.length-1;i>=0;i--){
  const b=bombs[i];b.phase+=dt*5;
  if(Math.hypot(player.x-b.x,player.y-b.y)<player.r+b.r){
   explode(b.x,b.y);
   bombs.splice(i,1);
   bombs.push(makeBomb());
   loseLife();
  }
 }
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vx*=.97;p.vy*=.97;
  p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }
 if(messageTimer>0){messageTimer-=dt;if(messageTimer<=0)say("Ăn cá nhỏ, tránh cá lớn và bom!");}
 hud();
}

function draw(){
 ctx.clearRect(0,0,900,520);
 const bg=ctx.createLinearGradient(0,0,0,520);
 bg.addColorStop(0,"#65d7e8");bg.addColorStop(1,"#08759f");
 ctx.fillStyle=bg;ctx.fillRect(0,0,900,520);
 for(let i=0;i<45;i++){
  const x=(i*137+30)%900,y=(i*83+20)%520;
  ctx.fillStyle="rgba(255,255,255,.25)";
  ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
 }
 fish.forEach(drawFish);
 bombs.forEach(drawBomb);
 drawPlayer();
 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life/(p.max||1));
  ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
 });
}

function loop(now){
 if(!running||paused)return;
 const dt=Math.min((now-last)/1000,.04);
 last=now;
 update(dt);
 if(running){draw();raf=requestAnimationFrame(loop);}
}

$("startBtn").addEventListener("click",reset);
$("restartBtn").addEventListener("click",reset);
$("playAgain").addEventListener("click",reset);
$("helpBtn").addEventListener("click",()=>{
 alert("HƯỚNG DẪN CHƠI\n\nWASD hoặc phím mũi tên để di chuyển.\nĂn cá nhỏ để tăng điểm và kích thước.\nTránh cá tím khổng lồ nếu bạn còn nhỏ.\nTránh bom vì bom sẽ phát nổ và làm mất 1 mạng.\nBạn có 4 mạng và 5 phút để chiến thắng!");
});
$("pauseBtn").addEventListener("click",()=>{
 if(!running)return;
 paused=!paused;
 $("pauseBtn").textContent=paused?"▶ TIẾP TỤC":"⏸ TẠM DỪNG";
 if(!paused){last=performance.now();raf=requestAnimationFrame(loop);}
});
function home(){
 running=false;cancelAnimationFrame(raf);
 result.style.display="none";screen("lobby");
}
$("homeBtn").addEventListener("click",home);
$("resultHome").addEventListener("click",home);

window.addEventListener("keydown",e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 keys[k]=true;
});
window.addEventListener("keyup",e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 keys[k]=false;
});
function setPointer(e){
 const rect=canvas.getBoundingClientRect();
 pointer.x=(e.clientX-rect.left)*900/rect.width;
 pointer.y=(e.clientY-rect.top)*520/rect.height;
 pointer.active=true;
}
canvas.addEventListener("pointerdown",setPointer);
canvas.addEventListener("pointermove",e=>{
 if(e.buttons||e.pointerType==="touch")setPointer(e);
});
screen("lobby");
})();
</script>
</body>
</html>
