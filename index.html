
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thế Giới Cá Mập 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#03172c;color:white;font-family:Arial,sans-serif}
button{cursor:pointer;border:0;border-radius:12px;padding:13px 25px;font-weight:bold;color:white;background:linear-gradient(135deg,#08a9d9,#2455c7);box-shadow:0 4px 15px #001b4d}
button:hover{filter:brightness(1.2);transform:scale(1.04)}
#ocean{position:fixed;inset:0}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,#00152a55,#00152acc)}
h1{font-size:clamp(35px,7vw,70px);color:#8ceaff;text-shadow:0 0 20px #00bfff;margin:0 0 8px}
.subtitle{letter-spacing:5px;color:#b9eaff;margin-bottom:35px}
.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
#game{display:none;position:fixed;inset:0;background:#063b60}
#gameCanvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:10px}
.hudbox{background:#001d40bb;border:1px solid #70dfff88;border-radius:12px;padding:10px 15px;font-weight:bold}
#backBtn{pointer-events:auto}
#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#001d40bb;padding:10px 16px;border-radius:12px;text-align:center;white-space:nowrap}
#message{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;background:#001027cc;z-index:10;overflow:hidden}
#message .content{position:relative;z-index:2;padding:30px 20px;max-width:650px;width:92%}
#message h2{font-size:clamp(43px,9vw,85px);margin:0 0 12px;color:#ffe78a;text-shadow:0 0 12px #ffb000,0 0 35px #ff8c00}
#message p{font-size:19px;color:#fff3c4}
#message .trophy{font-size:75px;filter:drop-shadow(0 0 20px gold)}
#message .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}
#message button{background:linear-gradient(135deg,#ffcf48,#d87900);color:#351800}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#ffe77a;box-shadow:0 0 15px 5px #ffae00;animation:burst 1.5s infinite}
@keyframes burst{0%{transform:scale(.2);opacity:0}40%{opacity:1}100%{transform:scale(2.8);opacity:0}}
@media(max-width:600px){.buttons{flex-direction:column;width:75%}.buttons button{width:100%}#help{font-size:12px;white-space:normal;width:90%}}
</style>
</head>
<body>

<div id="ocean"></div>

<div id="menu">
  <h1>THẾ GIỚI CÁ MẬP</h1>
  <div class="subtitle">FANTASY OCEAN 3D</div>
  <div class="buttons">
    <button onclick="startGame()">▶ BẮT ĐẦU</button>
    <button onclick="showInfo('CỬA HÀNG','Cửa hàng sẽ được mở khóa trong phiên bản tiếp theo!')">CỬA HÀNG</button>
    <button onclick="showInfo('BỘ SƯU TẬP','Khám phá những loài cá đặc biệt trong đại dương!')">BỘ SƯU TẬP</button>
    <button onclick="showInfo('CÀI ĐẶT','Dùng chuột hoặc phím WASD để điều khiển cá.')">CÀI ĐẶT</button>
  </div>
</div>

<div id="game">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hudbox">🐟 Điểm: <span id="score">0</span> / 100</div>
    <div class="hudbox">📏 Kích thước: <span id="size">1</span></div>
    <button id="backBtn" onclick="backToLobby()">VỀ SẢNH</button>
  </div>
  <div id="help">Di chuyển bằng chuột hoặc phím WASD / phím mũi tên. Ăn cá nhỏ để lớn lên!</div>
</div>

<div id="message">
  <div class="content">
    <div class="trophy">🏆</div>
    <h2 id="panelTitle">CHIẾN THẮNG!</h2>
    <p id="panelText">Bạn đã trở thành bá chủ đại dương!</p>
    <div class="actions">
      <button onclick="restartGame()">↻ CHƠI LẠI</button>
      <button onclick="backToLobby()">⌂ VỀ SẢNH</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ===== SẢNH ĐẠI DƯƠNG 3D ===== */
const ocean=document.getElementById("ocean");
let scene,camera,renderer,shark,clock;
function random(a,b){return Math.random()*(b-a)+a}

if(window.THREE){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x052c50);
 scene.fog=new THREE.Fog(0x052c50,15,65);
 camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);
 camera.position.set(0,5,17);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 ocean.appendChild(renderer.domElement);
 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0x9deaff,0x102344,2));
 const light=new THREE.DirectionalLight(0x8deaff,2);
 light.position.set(-5,10,8);scene.add(light);

 const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({color:0x075078,roughness:1})
 );
 floor.rotation.x=-Math.PI/2;floor.position.y=-4;scene.add(floor);

 // Hang động
 const caveMat=new THREE.MeshStandardMaterial({color:0x102b46,roughness:1});
 for(let i=0;i<16;i++){
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(random(1,2.2),1),caveMat);
  rock.position.set(random(-15,-8),random(-2,5),random(-12,-7));
  rock.scale.y=random(.7,1.5);scene.add(rock);
 }
 const caveHole=new THREE.Mesh(
  new THREE.CircleGeometry(3,40),
  new THREE.MeshBasicMaterial({color:0x010b20})
 );
 caveHole.position.set(-11,0,-6);scene.add(caveHole);

 // San hô
 const coralColors=[0xff6688,0xffa43b,0xb56bff,0x37e0c2];
 for(let i=0;i<35;i++){
  const group=new THREE.Group();
  const color=coralColors[i%coralColors.length];
  const mat=new THREE.MeshStandardMaterial({color,roughness:.5});
  for(let j=0;j<4;j++){
   const stem=new THREE.Mesh(new THREE.CylinderGeometry(.12,.22,random(1,2.5),8),mat);
   stem.position.set(random(-.5,.5),random(.5,1.3),random(-.4,.4));
   stem.rotation.z=random(-.5,.5);group.add(stem);
  }
  group.position.set(random(-18,18),-3.5,random(-12,4));
  scene.add(group);
 }

 // Rong biển
 for(let i=0;i<30;i++){
  const seaweed=new THREE.Mesh(
   new THREE.CylinderGeometry(.04,.12,random(1,3),7),
   new THREE.MeshStandardMaterial({color:0x20a878})
  );
  seaweed.position.set(random(-18,18),-2.5,random(-10,5));
  scene.add(seaweed);
 }

 // Pha lê phát sáng
 for(let i=0;i<12;i++){
  const crystal=new THREE.Mesh(
   new THREE.OctahedronGeometry(random(.3,.7)),
   new THREE.MeshStandardMaterial({color:0x58eaff,emissive:0x087dbb,emissiveIntensity:2})
  );
  crystal.position.set(random(-15,15),random(-2,3),random(-10,2));
  scene.add(crystal);
 }

 // Cá mập 3D
 shark=new THREE.Group();
 const bodyMat=new THREE.MeshStandardMaterial({color:0x6aabc5,roughness:.45});
 const bellyMat=new THREE.MeshStandardMaterial({color:0xe6f6fa});
 const body=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),bodyMat);
 body.scale.set(2.1,.8,.8);shark.add(body);
 const belly=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),bellyMat);
 belly.scale.set(1.7,.35,.65);belly.position.y=-.35;shark.add(belly);
 const tail=new THREE.Mesh(new THREE.ConeGeometry(.7,1.5,4),bodyMat);
 tail.rotation.z=Math.PI/2;tail.position.x=-2.5;shark.add(tail);
 const fin=new THREE.Mesh(new THREE.ConeGeometry(.55,1.4,4),bodyMat);
 fin.position.set(0,.9,0);shark.add(fin);
 shark.position.set(0,0,1);scene.add(shark);

 // Bong bóng
 const bubbles=[];
 for(let i=0;i<45;i++){
  const b=new THREE.Mesh(
   new THREE.SphereGeometry(random(.04,.13),10,10),
   new THREE.MeshBasicMaterial({color:0x9deaff,transparent:true,opacity:.6})
  );
  b.position.set(random(-18,18),random(-4,8),random(-10,5));
  scene.add(b);bubbles.push(b);
 }

 function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  shark.position.y=Math.sin(t*1.5)*.25;
  shark.rotation.z=Math.sin(t)*.06;
  tail.rotation.y=Math.sin(t*5)*.3;
  bubbles.forEach(b=>{b.position.y+=.012;if(b.position.y>9)b.position.y=-4});
  renderer.render(scene,camera);
 }
 animate();
}
window.addEventListener("resize",()=>{
 if(camera&&renderer){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
 }
});

/* ===== MENU ===== */
function showInfo(title,text){
 document.getElementById("panelTitle").textContent=title;
 document.getElementById("panelText").textContent=text;
 document.querySelector("#message .trophy").textContent="🌊";
 document.getElementById("message").style.display="flex";
}
function closeMessage(){
 document.getElementById("message").style.display="none";
}
function startGame(){
 closeMessage();
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
 resizeGame();
 resetGame();
}
function backToLobby(){
 playing=false;
 closeMessage();
 document.getElementById("game").style.display="none";
 document.getElementById("menu").style.display="flex";
}

/* ===== GAME CÁ LỚN NUỐT CÁ BÉ ===== */
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
let W,H,player,fishList,score,playing=false,mouse={x:0,y:0},keys={};
function resizeGame(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 W=innerWidth;H=innerHeight;
}
window.addEventListener("resize",()=>{if(document.getElementById("game").style.display==="block")resizeGame()});
canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener("touchmove",e=>{
 const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;
 e.preventDefault();
},{passive:false});
window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function makeFish(){
 const size=random(12,35);
 return {x:random(20,W-20),y:random(60,H-40),r:size,
  speed:random(.5,1.7),dir:Math.random()<.5?-1:1,
  color:["#ff9f43","#ff6b9d","#62e6ce","#d49bff","#ffe36e"][Math.floor(random(0,5))]};
}
function resetGame(){
 score=0;
 player={x:W/2,y:H/2,r:22};
 fishList=[];
 for(let i=0;i<35;i++)fishList.push(makeFish());
 document.getElementById("score").textContent=score;
 playing=true;
 requestAnimationFrame(gameLoop);
}
function drawFish(f){
 ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.dir,1);
 ctx.fillStyle=f.color;
 ctx.beginPath();ctx.ellipse(0,0,f.r*1.3,f.r*.75,0,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.moveTo(-f.r,0);ctx.lineTo(-f.r*1.8,-f.r*.8);ctx.lineTo(-f.r*1.8,f.r*.8);ctx.fill();
 ctx.fillStyle="white";ctx.beginPath();ctx.arc(f.r*.65,-f.r*.18,f.r*.16,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#10243a";ctx.beginPath();ctx.arc(f.r*.7,-f.r*.18,f.r*.08,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawPlayer(){
 ctx.save();ctx.translate(player.x,player.y);
 ctx.fillStyle="#4fc3e8";
 ctx.beginPath();ctx.ellipse(0,0,player.r*1.5,player.r*.8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#d9f6ff";
 ctx.beginPath();ctx.ellipse(5,player.r*.35,player.r,player.r*.3,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#4fc3e8";
 ctx.beginPath();ctx.moveTo(-player.r,0);ctx.lineTo(-player.r*1.9,-player.r*.8);ctx.lineTo(-player.r*1.9,player.r*.8);ctx.fill();
 ctx.fillStyle="white";ctx.beginPath();ctx.arc(player.r*.8,-player.r*.2,player.r*.13,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#10243a";ctx.beginPath();ctx.arc(player.r*.84,-player.r*.2,player.r*.07,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function gameLoop(){
 if(!playing)return;
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,"#0878a8");bg.addColorStop(1,"#032846");
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 // Ánh sáng và bong bóng
 for(let i=0;i<18;i++){
  const x=(i*137+performance.now()*.015)%W;
  const y=(i*83+performance.now()*.025)%H;
  ctx.strokeStyle="#b5efff55";ctx.beginPath();ctx.arc(x,y,3+(i%4),0,Math.PI*2);ctx.stroke();
 }

 let dx=0,dy=0;
 if(keys["arrowleft"]||keys["a"])dx--;
 if(keys["arrowright"]||keys["d"])dx++;
 if(keys["arrowup"]||keys["w"])dy--;
 if(keys["arrowdown"]||keys["s"])dy++;
 if(mouse.x||mouse.y){
  const mx=mouse.x-player.x,my=mouse.y-player.y;
  if(Math.hypot(mx,my)>8){dx=mx;dy=my}
 }
 const len=Math.hypot(dx,dy)||1;
 player.x+=dx/len*3.2;player.y+=dy/len*3.2;
 player.x=Math.max(player.r,Math.min(W-player.r,player.x));
 player.y=Math.max(player.r+45,Math.min(H-player.r,player.y));

 fishList.forEach((f,i)=>{
  f.x+=f.speed*f.dir;
  if(f.x>W+50)f.x=-50;
  if(f.x< -50)f.x=W+50;
  drawFish(f);
  const distance=Math.hypot(player.x-f.x,player.y-f.y);
  if(distance<player.r+f.r*.7){
   if(player.r>f.r*.85){
    score+=5;
    player.r+=.65;
    fishList[i]=makeFish();
    document.getElementById("score").textContent=score;
    document.getElementById("size").textContent=Math.floor(player.r/22*10)/10;
   }else{
    // Cá lớn hơn sẽ không bị ăn; chỉ đẩy cá nhỏ ra xa
    f.x+=f.dir*25;
   }
  }
 });
 drawPlayer();

 if(score>=100){winGame();return}
 requestAnimationFrame(gameLoop);
}
function winGame(){
 playing=false;
 document.getElementById("panelTitle").textContent="CHIẾN THẮNG!";
 document.getElementById("panelText").textContent="Xuất sắc! Bạn đã trở thành bá chủ đại dương!";
 document.querySelector("#message .trophy").textContent="🏆";
 document.getElementById("message").style.display="flex";
 makeFireworks();
}
function restartGame(){
 closeMessage();
 document.getElementById("game").style.display="block";
 resizeGame();resetGame();
}
function makeFireworks(){
 const box=document.getElementById("message");
 for(let i=0;i<35;i++){
  const s=document.createElement("div");
  s.className="spark";
  s.style.left=random(5,95)+"%";
  s.style.top=random(5,90)+"%";
  s.style.animationDelay=random(0,1.5)+"s";
  box.appendChild(s);
 }
}
</script>
</body>
</html>
