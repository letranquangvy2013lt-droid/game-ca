
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đại Dương Kỳ Ảo 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#031b45;font-family:Arial}
#scene{width:100vw;height:100vh}
#title{
 position:fixed;top:18px;left:0;width:100%;
 text-align:center;color:#a8faff;
 font-size:clamp(23px,5vw,42px);
 font-weight:bold;text-shadow:0 0 15px #00dfff;
 pointer-events:none;z-index:2;
}
#hint{
 position:fixed;bottom:15px;left:0;width:100%;
 text-align:center;color:white;font-size:14px;
 pointer-events:none;
}
</style>
</head>
<body>
<div id="title">🌊 ĐẠI DƯƠNG KỲ ẢO 🌊</div>
<div id="scene"></div>
<div id="hint">Khám phá hang động bí ẩn dưới đáy biển</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const container=document.getElementById("scene");

// 1. TẠO THẾ GIỚI 3D
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07517e);
scene.fog=new THREE.Fog(0x07517e,25,75);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,150
);
camera.position.set(0,9,23);
camera.lookAt(0,1,-5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
container.appendChild(renderer.domElement);

// 2. ÁNH SÁNG ĐẠI DƯƠNG
scene.add(new THREE.HemisphereLight(0x9eeaff,0x17234c,2));

const sunlight=new THREE.DirectionalLight(0x9deaff,2.5);
sunlight.position.set(-8,18,10);
sunlight.castShadow=true;
scene.add(sunlight);

const purpleLight=new THREE.PointLight(0x9c4dff,45,35);
purpleLight.position.set(0,5,-10);
scene.add(purpleLight);

const blueLight=new THREE.PointLight(0x00eaff,35,25);
blueLight.position.set(-8,3,-7);
scene.add(blueLight);

// 3. ĐÁY ĐẠI DƯƠNG
const seabed=new THREE.Mesh(
 new THREE.PlaneGeometry(100,100),
 new THREE.MeshStandardMaterial({
  color:0x164b68,roughness:1
 })
);
seabed.rotation.x=-Math.PI/2;
seabed.position.y=-4;
seabed.position.z=-10;
seabed.receiveShadow=true;
scene.add(seabed);

// 4. TẠO ĐÁ HANG ĐỘNG
function rock(x,y,z,sx,sy,sz,color=0x354c78){
 const obj=new THREE.Mesh(
  new THREE.DodecahedronGeometry(1,1),
  new THREE.MeshStandardMaterial({
   color,roughness:1
  })
 );
 obj.position.set(x,y,z);
 obj.scale.set(sx,sy,sz);
 obj.rotation.set(Math.random(),Math.random(),Math.random());
 obj.castShadow=true;
 obj.receiveShadow=true;
 scene.add(obj);
 return obj;
}

// Hai vách đá hai bên hang
for(let i=0;i<13;i++){
 let y=-2.5+i*.75;
 rock(-9-random(0,2),y,-12,2.5,2.2,3);
 rock(9+random(0,2),y,-12,2.5,2.2,3);
}

// Vòm đá phía trên hang
for(let i=0;i<13;i++){
 let a=Math.PI+i*Math.PI/12;
 let x=Math.cos(a)*9;
 let y=4+Math.sin(a)*5;
 rock(x,y,-12,2,2,3);
}

// Các tảng đá ở phía trước
for(let i=0;i<25;i++){
 rock(random(-16,16),-3.5,random(-22,4),
 random(.5,1.8),random(.3,1.2),random(.5,1.8),
 0x294b65);
}

// 5. MIỆNG HANG ĐỘNG
const entrance=new THREE.Mesh(
 new THREE.CircleGeometry(7.2,48),
 new THREE.MeshBasicMaterial({color:0x020b27})
);
entrance.position.set(0,1,-10);
entrance.rotation.y=0;
scene.add(entrance);

// Ánh sáng bí ẩn trong hang
const caveGlow=new THREE.PointLight(0x713cff,70,25);
caveGlow.position.set(0,2,-14);
scene.add(caveGlow);

// 6. TẠO SAN HÔ
function coral(x,z,color){
 const group=new THREE.Group();
 const mat=new THREE.MeshStandardMaterial({
  color,roughness:.45,emissive:color,
  emissiveIntensity:.12
 });

 function branch(px,py,pz,length,radius,angle){
  const mesh=new THREE.Mesh(
   new THREE.CylinderGeometry(radius*.65,radius,length,8),
   mat
  );
  mesh.position.set(px,py,pz);
  mesh.rotation.z=angle;
  mesh.castShadow=true;
  group.add(mesh);
 }

 branch(0,1,0,2,.25,0);
 branch(-.5,1.6,0,1.5,.18,-.65);
 branch(.5,1.6,0,1.5,.18,.65);
 branch(-.9,2.2,0,1,.13,-.8);
 branch(.9,2.2,0,1,.13,.8);
 branch(0,2.6,0,1,.13,0);

 group.position.set(x,-4,z);
 scene.add(group);
 return group;
}

const coralColors=[
 0xff4eae,0xff8755,0x9c69ff,
 0x35e5d2,0xffd84d,0x6b8cff
];

let corals=[];
for(let i=0;i<30;i++){
 const x=random(-17,17);
 const z=random(-23,3);
 const c=coral(
  x,z,coralColors[i%coralColors.length]
 );
 c.scale.setScalar(random(.7,1.7));
 corals.push(c);
}

// 7. PHA LÊ PHÁT SÁNG
let crystals=[];
for(let i=0;i<20;i++){
 const color=[0x33eaff,0xb66aff,0xff6bd6][i%3];
 const crystal=new THREE.Mesh(
  new THREE.OctahedronGeometry(random(.4,.9)),
  new THREE.MeshStandardMaterial({
   color,
   emissive:color,
   emissiveIntensity:1.8,
   metalness:.3,
   roughness:.2
  })
 );
 crystal.position.set(
  random(-12,12),random(-2,3),random(-20,-5)
 );
 crystal.rotation.set(random(0,3),random(0,3),random(0,3));
 scene.add(crystal);
 crystals.push(crystal);
}

// 8. RONG BIỂN
let seaweeds=[];
for(let i=0;i<28;i++){
 const height=random(1.5,4);
 const weed=new THREE.Mesh(
  new THREE.CylinderGeometry(.04,.13,height,7),
  new THREE.MeshStandardMaterial({
   color:i%2?0x20b77c:0x36d69a
  })
 );
 weed.position.set(random(-18,18),-4+height/2,random(-23,5));
 weed.userData.phase=random(0,7);
 scene.add(weed);
 seaweeds.push(weed);
}

// 9. BONG BÓNG NƯỚC
let bubbles=[];
for(let i=0;i<90;i++){
 const bubble=new THREE.Mesh(
  new THREE.SphereGeometry(random(.04,.13),8,8),
  new THREE.MeshBasicMaterial({
   color:0xb8f5ff,
   transparent:true,opacity:.55
  })
 );
 bubble.position.set(
  random(-20,20),random(-4,12),random(-25,8)
 );
 bubble.userData.speed=random(.5,2);
 scene.add(bubble);
 bubbles.push(bubble);
}

// 10. CÁC HÀM NGẪU NHIÊN
function random(min,max){
 return Math.random()*(max-min)+min;
}

// 11. HIỆU ỨNG CHUYỂN ĐỘNG
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();

 // Pha lê xoay
 crystals.forEach((c,i)=>{
  c.rotation.y+=.01;
  c.position.y+=Math.sin(t+i)*.0015;
 });

 // Rong biển đung đưa
 seaweeds.forEach((w,i)=>{
  w.rotation.z=Math.sin(t*1.5+w.userData.phase)*.13;
 });

 // San hô chuyển động nhẹ
 corals.forEach((c,i)=>{
  c.rotation.z=Math.sin(t*.6+i)*.025;
 });

 // Bong bóng nổi lên
 bubbles.forEach(b=>{
  b.position.y+=b.userData.speed*.025;
  if(b.position.y>12){
   b.position.y=-4;
   b.position.x=random(-20,20);
   b.position.z=random(-25,8);
  }
 });

 // Ánh sáng nhấp nháy
 caveGlow.intensity=65+Math.sin(t*2)*12;
 purpleLight.intensity=40+Math.sin(t*1.5)*8;

 renderer.render(scene,camera);
}

// 12. THAY ĐỔI KÍCH THƯỚC MÀN HÌNH
function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
window.addEventListener("resize",resize);

animate();
</script>
</body>
</html>
