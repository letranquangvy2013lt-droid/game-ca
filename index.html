<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thế Giới Cá Mập</title>
<style>
*{box-sizing:border-box}
body{margin:0;text-align:center;font-family:Arial;color:white;background:#063b63}
h1{color:#ffe77a;text-shadow:2px 3px 5px #00334d}
#info{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:18px;font-weight:bold;margin:12px}
canvas{width:min(96vw,900px);height:auto;display:block;margin:10px auto;border:4px solid #b7e9ff;border-radius:12px;touch-action:none}
button{padding:12px 25px;border:0;border-radius:10px;background:#ffcf35;font-size:17px;font-weight:bold;cursor:pointer;margin:4px}
#lobbyScreen{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#031a39aa,#031a39dd)}
#lobby3d{position:absolute;inset:0;z-index:0}
#lobby3d canvas{width:100%!important;height:100%!important;display:block;margin:0;border:0;border-radius:0}
.lobbyShade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#00162b88,#00162b22,#00162b88);pointer-events:none}
.lobbyContent{position:relative;z-index:2;width:min(94%,780px);padding:24px;text-align:center}
.lobbyTitle{font-size:clamp(35px,7vw,72px);font-weight:900;color:#c4f5ff;text-shadow:0 0 14px #00cfff,0 0 34px #087cbf;margin:0}
.lobbySub{letter-spacing:5px;color:#e2faff;margin:10px 0 32px}
.lobbyButtons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.lobbyButtons button{background:linear-gradient(135deg,#27d8ef,#1764b8);color:white;border:1px solid #a9f4ff;padding:14px 22px;min-width:145px;box-shadow:0 0 18px #00aaff66}
.lobbyTagline{color:#d7f6ff;margin-top:25px}
#lobbyInfo{display:none;position:fixed;inset:0;z-index:20;background:#00152bdd;align-items:center;justify-content:center;padding:20px}
#lobbyInfo .infoCard{background:linear-gradient(145deg,#0b4770,#081c3d);border:1px solid #7ceaff;border-radius:18px;padding:26px;max-width:420px;width:100%;box-shadow:0 0 30px #00bfff66}
#lobbyInfo h2{color:#9ceeff}
#lobbyInfo p{line-height:1.6}
#gameScreen{min-height:100vh;padding:1px 0 20px}
@media(max-width:600px){.lobbyButtons{flex-direction:column;align-items:center}.lobbyButtons button{width:min(85%,300px)}}
</style>
</head>
<body>

<div id="lobbyScreen">
  <div id="lobby3d"></div>
  <div class="lobbyShade"></div>
  <div class="lobbyContent">
    <h1 class="lobbyTitle">🦈 THẾ GIỚI CÁ MẬP 🦈</h1>
    <div class="lobbySub">FANTASY OCEAN · SẢNH CHỜ</div>
    <div class="lobbyButtons">
      <button onclick="enterGame()">▶ BẮT ĐẦU</button>
      <button onclick="lobbyInfo('CỬA HÀNG','Cửa hàng sẽ được bổ sung trong phiên bản tiếp theo.')">CỬA HÀNG</button>
      <button onclick="lobbyInfo('BỘ SƯU TẬP','Khám phá các loài cá và sinh vật trong đại dương.')">BỘ SƯU TẬP</button>
      <button onclick="lobbyInfo('HƯỚNG DẪN','Dùng WASD, phím mũi tên hoặc chạm vào nơi muốn bơi. Ăn cá nhỏ để lớn lên, tránh cá tím khổng lồ và mìn. Sống sót đủ 5 phút để chiến thắng!')">HƯỚNG DẪN</button>
    </div>
    <p class="lobbyTagline">Khám phá đại dương · Sinh tồn · Trở thành cá mập lớn nhất</p>
  </div>
</div>

<div id="lobbyInfo">
  <div class="infoCard">
    <h2 id="lobbyInfoTitle"></h2>
    <p id="lobbyInfoText"></p>
    <button onclick="closeLobbyInfo()">ĐÓNG</button>
  </div>
</div>

<div id="gameScreen" style="display:none">
<h1>🦈 THẾ GIỚI CÁ MẬP 🦈</h1>
<div id="info">
<span id="score">Điểm: 0</span>
<span id="lives">Mạng: 4/4</span>
<span id="size">Kích thước: 18</span>
<span id="timer">Thời gian: 05:00</span>
</div>
<canvas id="game" width="900" height="520"></canvas>
<button onclick="togglePause()" id="pauseButton">⏸️ TẠM DỪNG</button>
<button onclick="restart()">🔄 CHƠI LẠI</button>
<p>Dùng WASD, phím mũi tên hoặc chạm vào nơi muốn bơi. Sống sót đủ 5 phút để chiến thắng!</p>
<button onclick="backToLobby()">🏠 VỀ SẢNH CHỜ</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let p,fish,mines,purpleFish,keys,score,world;
let hitLock,gameOver,raf,lastTime;
let pointer=null,bubbles=[],jellyfish=[],explosions=[];
let animationTime=0;
let timeLeft=300,victory=false,paused=false;
let fireworks=[],confetti=[],victoryStarted=false;
let fireworkCooldown=0;

const rand=(a,b)=>Math.random()*(b-a)+a;

function addFish(x){
 const styles=["cute","colorful","natural"];
 const colors=["#ff9f43","#ff6fae","#ffe66d","#55d6be","#a78bfa","#55aaff","#ff795e"];
 fish.push({
  x,y:rand(65,420),r:rand(9,17),speed:rand(.7,1.8),
  phase:rand(0,7),direction:Math.random()<.5?1:-1,
  style:styles[Math.floor(rand(0,3))],
  color:colors[Math.floor(rand(0,colors.length))]
 });
}

function addMine(x){
 mines.push({x,y:rand(70,420),r:17,speed:rand(2,3.5),phase:rand(0,7)});
}

function addPurpleFish(x){
 purpleFish.push({x,y:rand(100,380),r:48,speed:rand(.8,1.4),phase:rand(0,7),direction:Math.random()<.5?1:-1});
}

function createBubbles(){
 bubbles=[];
 for(let i=0;i<45;i++)bubbles.push({x:rand(0,900),y:rand(0,520),r:rand(2,7),speed:rand(.4,1.5)});
}

function createJellyfish(){
 jellyfish=[];
 const colors=["#ff8de2","#8ceaff","#d6a0ff","#fff08c"];
 for(let i=0;i<7;i++)jellyfish.push({
  x:rand(50,850),y:rand(50,450),r:rand(13,23),
  speed:rand(.3,.8),phase:rand(0,7),color:colors[i%4]
 });
}

function createExplosion(x,y){
 const particles=[];
 for(let i=0;i<35;i++){
  const a=rand(0,Math.PI*2),s=rand(2,7);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,size:rand(3,7),life:1});
 }
 explosions.push({x,y,radius:5,life:1,particles});
}

function drawExplosions(dt){
 for(let i=explosions.length-1;i>=0;i--){
  const e=explosions[i];
  e.life-=.035*dt;e.radius+=5*dt;
  ctx.save();
  ctx.globalAlpha=Math.max(0,e.life);
  ctx.strokeStyle="#ffcc33";ctx.lineWidth=6;
  ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);ctx.stroke();
  const g=ctx.createRadialGradient(e.x,e.y,2,e.x,e.y,e.radius);
  g.addColorStop(0,"white");g.addColorStop(.35,"#ffdd33");g.addColorStop(1,"rgba(255,60,0,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,e.radius,0,7);ctx.fill();
  for(const a of e.particles){
   a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=.035*dt;
   ctx.globalAlpha=Math.max(0,a.life)*Math.max(0,e.life);
   ctx.fillStyle=a.life>.5?"#ffcc22":"#ff5522";
   ctx.beginPath();ctx.arc(a.x,a.y,a.size*Math.max(0,a.life),0,7);ctx.fill();
  }
  ctx.restore();
  if(e.life<=0)explosions.splice(i,1);
 }
}

function drawSunlight(t){
 ctx.save();
 for(let i=0;i<9;i++){
  const x=40+i*110,sway=Math.sin(t*.0005+i)*25;
  ctx.fillStyle="rgba(255,245,180,.07)";
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+35+sway,390);
  ctx.lineTo(x+95+sway,390);ctx.lineTo(x+65,0);ctx.fill();
 }
 ctx.restore();
}

function drawBubbles(dt){
 for(const b of bubbles){
  b.y-=b.speed*dt;b.x+=Math.sin(b.y*.025)*.5*dt;
  if(b.y<-10){b.y=530;b.x=rand(0,900);}
  ctx.strokeStyle="rgba(220,250,255,.7)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.7)";
  ctx.beginPath();ctx.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.2,0,7);ctx.fill();
 }
}

function drawJellyfish(t,dt){
 for(const j of jellyfish){
  j.y+=Math.sin(t*.001+j.phase)*.5*dt-j.speed*.25*dt;
  j.x+=Math.sin(t*.0007+j.phase)*.35*dt;
  if(j.y<-50){j.y=550;j.x=rand(50,850);}
  ctx.save();ctx.translate(j.x,j.y);
  ctx.shadowColor=j.color;ctx.shadowBlur=22;ctx.fillStyle=j.color;
  ctx.beginPath();ctx.arc(0,0,j.r,Math.PI,0);
  ctx.quadraticCurveTo(j.r,j.r*.8,0,j.r*.55);
  ctx.quadraticCurveTo(-j.r,j.r*.8,-j.r,0);ctx.fill();
  ctx.strokeStyle=j.color;ctx.lineWidth=2;
  for(let i=-2;i<=2;i++){
   ctx.beginPath();ctx.moveTo(i*j.r*.28,j.r*.45);
   ctx.quadraticCurveTo(i*j.r*.3+Math.sin(t*.004+i)*5,j.r,i*j.r*.35,j.r*1.5);ctx.stroke();
  }
  ctx.shadowBlur=0;ctx.fillStyle="#333";
  ctx.beginPath();ctx.arc(-j.r*.3,0,2,0,7);ctx.arc(j.r*.3,0,2,0,7);ctx.fill();
  ctx.restore();
 }
}

function background(t,dt){
 const g=ctx.createLinearGradient(0,0,0,520);
 g.addColorStop(0,"#24c5dc");g.addColorStop(.45,"#078fb6");g.addColorStop(1,"#003b68");
 ctx.fillStyle=g;ctx.fillRect(0,0,900,520);
 drawSunlight(t);
 ctx.fillStyle="#e6cb79";ctx.fillRect(0,475,900,45);
 for(let i=0;i<35;i++){
  let x=(i*37-world*1.2)%900;if(x<0)x+=900;
  ctx.fillStyle="#c9a957";ctx.beginPath();ctx.arc(x,490+(i%3)*8,3,0,7);ctx.fill();
 }
 for(let i=0;i<12;i++){
  let x=(i*95-world*.5)%950;if(x<0)x+=950;
  ctx.strokeStyle=i%2?"#168b59":"#37a85d";ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(x,475);
  ctx.quadraticCurveTo(x-20,440,x+Math.sin(t*.002+i)*18,400);ctx.stroke();
 }
 for(let i=0;i<8;i++){
  let x=(i*125-world*.35)%1000;if(x<0)x+=1000;
  ctx.strokeStyle=["#ff8066","#ff5ebc","#f4a64a","#a87ce8"][i%4];
  ctx.lineWidth=6;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x,475);ctx.lineTo(x,450);
  ctx.lineTo(x-12,435);ctx.moveTo(x,450);ctx.lineTo(x+12,430);
  ctx.moveTo(x,460);ctx.lineTo(x+18,448);ctx.stroke();
 }
}

function drawCreature(f,t,player=false,purple=false){
 const r=f.r,phase=t*.009+(f.phase||0);
 const wiggle=Math.sin(phase)*.23,tail=Math.sin(phase*1.5)*.35;
 const dir=player?1:(f.direction||1);
 ctx.save();ctx.translate(f.x,f.y);
 if(player)ctx.rotate(p.angle);else if(dir<0)ctx.scale(-1,1);
 ctx.save();ctx.rotate(tail);
 ctx.fillStyle=purple?"#8b35c9":player?"#707b84":f.color;
 ctx.beginPath();ctx.moveTo(-r*.65,0);ctx.lineTo(-r*1.65,-r*.85);
 ctx.lineTo(-r*1.45,0);ctx.lineTo(-r*1.65,r*.85);ctx.closePath();ctx.fill();
 ctx.restore();
 ctx.save();ctx.rotate(wiggle);
 let bodyColor=purple?"#a855e8":player?"#7d8991":f.color;
 ctx.fillStyle=bodyColor;
 ctx.beginPath();ctx.ellipse(0,0,r*1.25,r*.72,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=player?"#dce4e8":"#fff";
 ctx.beginPath();ctx.ellipse(r*.25,r*.25,r*.72,r*.25,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=bodyColor;
 ctx.beginPath();ctx.moveTo(-r*.2,-r*.55);ctx.lineTo(r*.15,-r*1.05);ctx.lineTo(r*.55,-r*.55);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(r*.65,-r*.15,r*.16,0,7);ctx.fill();
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(r*.7,-r*.15,r*.08,0,7);ctx.fill();
 ctx.strokeStyle="#17394b";ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(r*.85,r*.2,r*.2,.2,1.8);ctx.stroke();
 ctx.restore();ctx.restore();
}
