
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ca Lon Nuot Ca Be</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #b9f1ff;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #075985; margin: 12px 0; }
#info { font-size: 19px; margin: 8px; font-weight: bold; }
canvas {
  background: linear-gradient(#62d9f5, #087bb5);
  border: 4px solid white;
  border-radius: 12px;
  width: min(94vw, 800px);
  height: auto;
  touch-action: none;
}
button {
  padding: 12px 20px;
  margin: 6px;
  border: 0;
  border-radius: 10px;
  background: #0284c7;
  color: white;
  font-size: 17px;
  cursor: pointer;
}
p { margin: 8px; }
</style>
</head>
<body>
<h1>🐠 Cá Lớn Nuốt Cá Bé 🐟</h1>
<div id="info">Điểm: 0 | Kích thước: 1</div>
<canvas id="game" width="800" height="500"></canvas>
<p>Dùng phím WASD hoặc phím mũi tên để di chuyển.</p>
<button onclick="restart()">Chơi lại</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

let player, fishes, score, gameOver, keys;

function restart() {
  player = { x: 400, y: 250, r: 18, speed: 3.5 };
  fishes = [];
  score = 0;
  gameOver = false;
  keys = {};
  for (let i = 0; i < 18; i++) spawnFish();
  requestAnimationFrame(loop);
}

function spawnFish() {
  const r = 7 + Math.random() * 20;
  fishes.push({
    x: 15 + Math.random() * 770,
    y: 15 + Math.random() * 470,
    r,
    color: ["#ffcf33", "#ff718b", "#c084fc",
            "#5eead4", "#ffffff"][Math.floor(Math.random()*5)],
    speed: 0.4 + Math.random() * 1.1,
    dir: Math.random() < 0.5 ? -1 : 1
  });
}

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});
document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

let pointerDown = false;
canvas.addEventListener("pointerdown", () => pointerDown = true);
canvas.addEventListener("pointerup", () => pointerDown = false);
canvas.addEventListener("pointerleave", () => pointerDown = false);
canvas.addEventListener("pointermove", e => {
  if (!pointerDown || gameOver) return;
  const rect = canvas.getBoundingClientRect();
  player.x = (e.clientX - rect.left) * canvas.width / rect.width;
  player.y = (e.clientY - rect.top) * canvas.height / rect.height;
});


function drawFish(f, isPlayer = false) {
  ctx.save();
  ctx.translate(f.x, f.y);

  // Xoay cá theo góc 90 độ
  ctx.rotate(f.angle || 0);

  // Thân cá
  ctx.fillStyle = f.color || "#ff8c42";
  ctx.beginPath();
  ctx.ellipse(0, 0, f.r * 1.3, f.r * 0.8,
              0, 0, Math.PI * 2);
  ctx.fill();

  // Đuôi cá
  ctx.beginPath();
  ctx.moveTo(-f.r, 0);
  ctx.lineTo(-f.r * 1.8, -f.r * 0.7);
  ctx.lineTo(-f.r * 1.8, f.r * 0.7);
  ctx.closePath();
  ctx.fill();

  // Mắt cá
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(f.r * 0.65, -f.r * 0.2,
          Math.max(2, f.r * 0.22), 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#123";
  ctx.beginPath();
  ctx.arc(f.r * 0.73, -f.r * 0.2,
          Math.max(1, f.r * 0.1), 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}
  ctx.save();
  ctx.translate(f.x, f.y);
  if (f.dir < 0) ctx.scale(-1, 1);

  ctx.fillStyle = f.color || "#ff8c42";
  ctx.beginPath();
  ctx.ellipse(0, 0, f.r * 1.3, f.r * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-f.r, 0);
  ctx.lineTo(-f.r * 1.8, -f.r * 0.7);
  ctx.lineTo(-f.r * 1.8, f.r * 0.7);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(f.r * 0.65, -f.r * 0.2, Math.max(2, f.r * 0.22), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#123";
  ctx.beginPath();
  ctx.arc(f.r * 0.73, -f.r * 0.2, Math.max(1, f.r * 0.1), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Bong bóng dưới nước
  for (let i = 0; i < 15; i++) {
    const x = (i * 67 + 30) % 800;
    const y = (i * 91 + Date.now() * 0.025) % 500;
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.arc(x, y, 3 + i % 5, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (!gameOver) {
   
if (keys["arrowleft"] || keys["a"]) {
  player.x -= player.speed;
  player.angle = Math.PI;
}
if (keys["arrowright"] || keys["d"]) {
  player.x += player.speed;
  player.angle = 0;
}
if (keys["arrowup"] || keys["w"]) {
  player.y -= player.speed;
  player.angle = -Math.PI / 2;
}
if (keys["arrowdown"] || keys["s"]) {
  player.y += player.speed;
  player.angle = Math.PI / 2;
}
    player.x = Math.max(player.r, Math.min(800-player.r, player.x));
    player.y = Math.max(player.r, Math.min(500-player.r, player.y));

    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      f.x += f.speed * f.dir;
      if (f.x < f.r * 2 || f.x > 800 - f.r * 2) f.dir *= -1;

      const d = Math.hypot(player.x-f.x, player.y-f.y);
      if (d < player.r + f.r * 0.7) {
        if (player.r >= f.r * 0.85) {
          score += Math.max(1, Math.round(f.r));
          player.r = Math.min(65, player.r + 1.1);
          fishes.splice(i, 1);
          spawnFish();
        } else {
          gameOver = true;
        }
      }
    }
  }

  fishes.forEach(f => drawFish(f));
  drawFish(player, true);

  info.textContent = "Điểm: " + score +
    " | Kích thước: " + Math.round(player.r / 18 * 10) / 10;

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, 0, 800, 500);
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 42px Arial";
    ctx.fillText("GAME OVER!", 400, 230);
    ctx.font = "24px Arial";
    ctx.fillText("Điểm của bạn: " + score, 400, 275);
    ctx.fillText("Nhấn Chơi lại để thử tiếp", 400, 320);
  } else {
    requestAnimationFrame(loop);
  }
}
restart();
</script>
</body>
</html>
