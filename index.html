
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thế Giới Cá Mập - Đại Dương Nhiệt Đới</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #063b63;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 12px 0 6px;
  color: #ffe77a;
  text-shadow: 2px 3px 5px #00334d;
}

#info {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
  font-size: 19px;
  margin: 10px;
  font-weight: bold;
}

canvas {
  display: block;
  width: min(96vw, 900px);
  height: auto;
  margin: 10px auto;
  border: 4px solid #b7e9ff;
  border-radius: 12px;
  background: #087eae;
  touch-action: none;
}

button {
  padding: 11px 24px;
  border: 0;
  border-radius: 10px;
  background: #ffcf35;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 8px;
}

p { margin: 8px; }
</style>
</head>

<body>

<h1>🦈 THẾ GIỚI CÁ MẬP 🦈</h1>

<div id="info">
  <span id="score">Điểm: 0</span>
  <span id="lives">Mạng: 4/4</span>
  <span id="size">Kích thước: 18</span>
</div>

<canvas id="game" width="900" height="520"></canvas>

<button onclick="restart()">🔄 CHƠI LẠI</button>

<p>Dùng WASD, phím mũi tên hoặc nhấn chuột vào vị trí muốn bơi.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let p, fish, mines, purpleFish, keys, score, world;
let hitLock, lastTime, raf, gameOver;
let pointer = null;
let explosions = [];
let bubbles = [];
let jellyfish = [];

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

// Khởi tạo bong bóng
function createBubbles() {
  bubbles = [];
  for (let i = 0; i < 45; i++) {
    bubbles.push({
      x: rand(0, 900),
      y: rand(0, 520),
      r: rand(2, 7),
      speed: rand(0.4, 1.5),
      drift: rand(-0.3, 0.3)
    });
  }
}

// Khởi tạo sứa phát sáng
function createJellyfish() {
  jellyfish = [];
  for (let i = 0; i < 7; i++) {
    jellyfish.push({
      x: rand(50, 850),
      y: rand(80, 400),
      r: rand(13, 23),
      speed: rand(0.3, 0.8),
      phase: rand(0, 6.28),
      color: ["#ff8de2", "#8ceaff", "#d6a0ff", "#fff08c"][i % 4]
    });
  }
}

function addFish(x) {
  fish.push({
    x: x,
    y: rand(60, 390),
    r: rand(8, 16),
    speed: rand(0.7, 1.8),
    phase: rand(0, 6.28),
    color: ["#ffb347", "#ff79a8", "#8ce36b", "#ffe66d"][Math.floor(rand(0,4))]
  });
}

function addMine(x) {
  mines.push({
    x: x,
    y: rand(80, 390),
    r: 17,
    speed: rand(2, 3.5),
    phase: rand(0, 6.28)
  });
}

function addPurpleFish(x) {
  purpleFish.push({
    x: x,
    y: rand(100, 380),
    r: 48,
    speed: rand(0.8, 1.4),
    phase: rand(0, 6.28),
    direction: Math.random() < 0.5 ? 1 : -1
  });
}

// Hiệu ứng nổ
function createExplosion(x, y) {
  let particles = [];

  for (let i = 0; i < 35; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = rand(2, 7);

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: rand(3, 7),
      life: 1
    });
  }

  explosions.push({
    x, y,
    radius: 5,
    life: 1,
    particles
  });
}

function drawExplosions(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {
    let ex = explosions[i];

    ex.life -= 0.035 * dt;
    ex.radius += 5 * dt;

    ctx.save();
    ctx.globalAlpha = Math.max(0, ex.life);

    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffcc33";
    ctx.lineWidth = 6;
    ctx.stroke();

    let glow = ctx.createRadialGradient(
      ex.x, ex.y, 2,
      ex.x, ex.y, ex.radius
    );

    glow.addColorStop(0, "#ffffff");
    glow.addColorStop(0.35, "#ffdd33");
    glow.addColorStop(1, "rgba(255,60,0,0)");

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
    ctx.fill();

    for (let particle of ex.particles) {
      particle.x += particle.vx * dt;
      particle.y += particle.vy * dt;
      particle.life -= 0.035 * dt;

      ctx.globalAlpha = Math.max(0, particle.life) * ex.life;
      ctx.fillStyle = Math.random() > 0.5 ? "#ffcc22" : "#ff5522";

      ctx.beginPath();
      ctx.arc(
        particle.x, particle.y,
        particle.size * Math.max(0, particle.life),
        0, Math.PI * 2
      );
      ctx.fill();
    }

    ctx.restore();

    if (ex.life <= 0) explosions.splice(i, 1);
  }
}

// Vẽ ánh sáng dưới biển
function drawSunlight(t) {
  ctx.save();

  for (let i = 0; i < 9; i++) {
    let x = 40 + i * 110;
    let sway = Math.sin(t * 0.0005 + i) * 25;

    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + 35 + sway, 390);
    ctx.lineTo(x + 95 + sway, 390);
    ctx.lineTo(x + 65, 0);
    ctx.closePath();

    ctx.fillStyle = "rgba(255, 245, 180, 0.055)";
    ctx.fill();
  }

  ctx.restore();
}

// Vẽ bong bóng
function drawBubbles(dt) {
  for (let b of bubbles) {
    b.y -= b.speed * dt;
    b.x += Math.sin(b.y * 0.025) * b.drift * dt;

    if (b.y < -10) {
      b.y = 530;
      b.x = rand(0, 900);
    }

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(220,250,255,.65)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(b.x - b.r * .3, b.y - b.r * .3, b.r * .2, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fill();
  }
}

// Vẽ sứa
function drawJellyfish(t, dt) {
  for (let j of jellyfish) {
    j.y += Math.sin(t * .001 + j.phase) * 0.5 * dt;
    j.x += Math.sin(t * .0007 + j.phase) * 0.35 * dt;
    j.y -= j.speed * 0.25 * dt;

    if (j.y < -50) {
      j.y = 550;
      j.x = rand(50, 850);
    }

    ctx.save();
    ctx.translate(j.x, j.y);

    // Ánh sáng quanh sứa
    ctx.shadowColor = j.color;
    ctx.shadowBlur = 22;

    // Thân sứa
    ctx.fillStyle = j.color;
    ctx.beginPath();
    ctx.arc(0, 0, j.r, Math.PI, 0);
    ctx.quadraticCurveTo(j.r, j.r * .8, 0, j.r * .55);
    ctx.quadraticCurveTo(-j.r, j.r * .8, -j.r, 0);
    ctx.fill();

    // Xúc tu
    ctx.shadowBlur = 8;
    ctx.strokeStyle = j.color;
    ctx.lineWidth = 2;

    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * j.r * .28, j.r * .45);
      ctx.quadraticCurveTo(
        i * j.r * .3 + Math.sin(t * .004 + i) * 5,
        j.r,
        i * j.r * .35,
        j.r * 1.5
      );
      ctx.stroke();
    }

    // Mắt
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.arc(-j.r * .3, 0, 2, 0, 7);
    ctx.arc(j.r * .3, 0, 2, 0, 7);
    ctx.fill();

    ctx.restore();
  }
}

function restart() {
  if (raf) cancelAnimationFrame(raf);

  p = {
    x: 250, y: 250, r: 18,
    angle: 0, speed: 3.5, lives: 4
  };

  fish = [];
  mines = [];
  purpleFish = [];
  keys = {};
  score = 0;
  world = 0;
  hitLock = 0;
  gameOver = false;
  pointer = null;
  explosions = [];
  lastTime = 0;

  createBubbles();
  createJellyfish();

  for (let i = 0; i < 35; i++) addFish(350 + i * 100);
  for (let i = 0; i < 15; i++) addMine(700 + i * 350);
  for (let i = 0; i < 5; i++) addPurpleFish(1200 + i * 1500);

  updateInfo();
  raf = requestAnimationFrame(loop);
}

function updateInfo() {
  document.getElementById("score").textContent = "Điểm: " + score;
  document.getElementById("lives").textContent = "Mạng: " + p.lives + "/4";
  document.getElementById("size").textContent =
    "Kích thước: " + Math.round(p.r);
}

// Phong cảnh đại dương nhiệt đới
function background(t, dt) {
  let g = ctx.createLinearGradient(0, 0, 0, 520);
  g.addColorStop(0, "#24c5dc");
  g.addColorStop(0.45, "#078fb6");
  g.addColorStop(1, "#003b68");

  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 900, 520);

  drawSunlight(t);

  // Đáy cát
  ctx.fillStyle = "#e6cb79";
  ctx.fillRect(0, 475, 900, 45);

  // Các vân cát
  ctx.fillStyle = "#c9a957";
  for (let i = 0; i < 35; i++) {
    let x = (i * 37 - world * 1.2) % 900;
    if (x < 0) x += 900;

    ctx.beginPath();
    ctx.arc(x, 490 + (i % 3) * 8, 3, 0, 7);
    ctx.fill();
  }

  // Rong biển
  for (let i = 0; i < 12; i++) {
    let x = (i * 95 - world * 0.5) % 950;
    if (x < -20) x += 950;

    ctx.strokeStyle = i % 2 ? "#168b59" : "#37a85d";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(x, 475);
    ctx.quadraticCurveTo(
      x - 20,
      440,
      x + Math.sin(t * .002 + i) * 18,
      400
    );
    ctx.stroke();
  }

  // San hô màu sắc ở đáy
  for (let i = 0; i < 8; i++) {
    let x = (i * 125 - world * .35) % 1000;
    if (x < -40) x += 1000;

    ctx.strokeStyle = ["#ff8066", "#ff5ebc", "#f4a64a", "#a87ce8"][i % 4];
    ctx.lineWidth = 6;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(x, 475);
    ctx.lineTo(x, 450);
    ctx.lineTo(x - 12, 435);
    ctx.moveTo(x, 450);
    ctx.lineTo(x + 12, 430);
    ctx.moveTo(x, 460);
    ctx.lineTo(x + 18, 448);
    ctx.stroke();
  }
}

// Vẽ cá mập và cá nhỏ
function drawFish(f, player = false) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(player ? f.angle : 0);

  if (player) {
    ctx.fillStyle = "#707b84";
    ctx.beginPath();
    ctx.moveTo(-f.r * .75, 0);
    ctx.lineTo(-f.r * 1.8, -f.r * .9);
    ctx.lineTo(-f.r * 1.55, 0);
    ctx.lineTo(-f.r * 1.8, f.r * .9);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#929da5";
    ctx.beginPath();
    ctx.ellipse(0, 0, f.r * 1.45, f.r * .72, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-f.r * .1, -f.r * .55);
    ctx.lineTo(f.r * .25, -f.r * 1.25);
    ctx.lineTo(f.r * .65, -f.r * .5);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(f.r * .85, -f.r * .22, Math.max(2, f.r * .12), 0, 7);
    ctx.fill();

    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(f.r * .9, -f.r * .22, Math.max(1, f.r * .06), 0, 7);
    ctx.fill();

    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(f.r * .95, f.r * .22);
    ctx.lineTo(f.r * 1.25, f.r * .25);
    ctx.stroke();

    ctx.fillStyle = "white";
    for (let i = 0; i < 3; i++) {
      let x = f.r * (0.94 + i * .1);
      ctx.beginPath();
      ctx.moveTo(x, f.r * .23);
      ctx.lineTo(x + f.r * .07, f.r * .43);
      ctx.lineTo(x + f.r * .13, f.r * .23);
      ctx.fill();
    }
  } else {
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.moveTo(-f.r * .7, 0);
    ctx.lineTo(-f.r * 1.5, -f.r * .8);
    ctx.lineTo(-f.r * 1.5, f.r * .8);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(0, 0, f.r, f.r * .65, 0, 0, 7);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(f.r * .55, -f.r * .15, Math.max(1.5, f.r * .13), 0, 7);
    ctx.fill();

    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(f.r * .58, -f.r * .15, Math.max(1, f.r * .07), 0, 7);
    ctx.fill();
  }

  ctx.restore();
}

// Cá tím khổng lồ
function drawPurpleFish(f) {
  ctx.save();
  ctx.translate(f.x, f.y);

  if (f.direction < 0) ctx.scale(-1, 1);

  ctx.fillStyle = "#8b35c9";
  ctx.beginPath();
  ctx.moveTo(-f.r * .65, 0);
  ctx.lineTo(-f.r * 1.5, -f.r * .8);
  ctx.lineTo(-f.r * 1.5, f.r * .8);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#a855e8";
  ctx.beginPath();
  ctx.ellipse(0, 0, f.r, f.r * .68, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#7835bd";
  ctx.beginPath();
  ctx.moveTo(-f.r * .2, -f.r * .55);
  ctx.lineTo(f.r * .15, -f.r * 1.05);
  ctx.lineTo(f.r * .5, -f.r * .5);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(f.r * .62, -f.r * .2, f.r * .13, 0, 7);
  ctx.fill();

  ctx.fillStyle = "#171027";
  ctx.beginPath();
  ctx.arc(f.r * .65, -f.r * .2, f.r * .07, 0, 7);
  ctx.fill();

  ctx.strokeStyle = "#45145f";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(f.r * .7, f.r * .18, f.r * .2, 0, Math.PI * .8);
  ctx.stroke();

  ctx.restore();
}

// Mìn
function drawMine(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.fillStyle = "#252d35";

  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath();
    ctx.moveTo(0, -m.r * .65);
    ctx.lineTo(-5, -m.r * 1.35);
    ctx.lineTo(5, -m.r * 1.35);
    ctx.closePath();
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(0, 0, m.r, 0, 7);
  ctx.fill();

  ctx.fillStyle = "#e5e5e5";
  ctx.beginPath();
  ctx.arc(-5, -5, 4, 0, 7);
  ctx.fill();

  ctx.restore();
}

function loop(t) {
  if (!lastTime) lastTime = t;

  let dt = Math.min((t - lastTime) / 16.67, 2);
  lastTime = t;

  background(t, dt);

  // Cảnh vẫn chuyển động kể cả khi kết thúc
  drawBubbles(dt);
  drawJellyfish(t, dt);

  if (!gameOver) {
    let dx = 0, dy = 0;

    if (keys["ArrowUp"] || keys["w"]) dy--;
    if (keys["ArrowDown"] || keys["s"]) dy++;
    if (keys["ArrowLeft"] || keys["a"]) dx--;
    if (keys["ArrowRight"] || keys["d"]) dx++;

    if (pointer) {
      let px = pointer.x - p.x;
      let py = pointer.y - p.y;
      let distance = Math.hypot(px, py);

      if (distance > 8) {
        dx = px / distance;
        dy = py / distance;
      }
    }

    if (dx || dy) {
      let length = Math.hypot(dx, dy);
      dx /= length;
      dy /= length;

      p.x += dx * p.speed * dt;
      p.y += dy * p.speed * dt;
      p.angle = Math.atan2(dy, dx);
    }

    p.x = Math.max(p.r * 1.5, Math.min(900 - p.r * 1.5, p.x));
    p.y = Math.max(35, Math.min(465 - p.r, p.y));

    world += 1.5 * dt;
    if (hitLock > 0) hitLock -= dt;

    // Cá nhỏ
    for (let i = fish.length - 1; i >= 0; i--) {
      let f = fish[i];

      f.x -= f.speed * dt;
      f.y += Math.sin(t * .002 + f.phase) * .5 * dt;

      if (f.x < -30) {
        f.x = 950 + rand(0, 300);
        f.y = rand(60, 420);
      }

      if (p.r >= f.r * 1.05 &&
          Math.hypot(p.x - f.x, p.y - f.y) < p.r + f.r * .65) {
        score += 10;
        p.r = Math.min(p.r + .7, 65);
        fish.splice(i, 1);
        addFish(950 + rand(0, 500));
      }
    }

    // Cá tím khổng lồ
    for (let i = purpleFish.length - 1; i >= 0; i--) {
      let f = purpleFish[i];

      f.x += f.speed * f.direction * dt;
      f.y += Math.sin(t * .0015 + f.phase) * .6 * dt;

      if (f.x < -100) {
        f.direction = 1;
        f.x = -90;
      }

      if (f.x > 1000) {
        f.direction = -1;
        f.x = 990;
      }

      let distance = Math.hypot(p.x - f.x, p.y - f.y);

      if (distance < p.r * 1.2 + f.r * .7) {
        if (p.r > f.r * 1.2) {
          score += 50;
          p.r = Math.min(p.r + 5, 65);
          createExplosion(f.x, f.y);
          purpleFish.splice(i, 1);
          addPurpleFish(1100 + rand(0, 1500));
        } else {
          gameOver = true;
        }
      }
    }

    // Mìn
    for (let m of mines) {
      m.x -= m.speed * 1.5 * dt;
      m.y += Math.sin(t * .002 + m.phase) * 1.2 * dt;

      if (m.x < -40) {
        m.x = 950 + rand(100, 500);
        m.y = rand(70, 420);
      }

      if (hitLock <= 0 &&
          Math.hypot(p.x - m.x, p.y - m.y) < p.r + m.r) {

        createExplosion(m.x, m.y);

        p.lives--;
        hitLock = 60;

        m.x = 950 + rand(100, 500);
        m.y = rand(70, 420);

        if (p.lives <= 0) {
          p.lives = 0;
          gameOver = true;
        }
      }
    }
  }

  // Vẽ các nhân vật
  for (let f of fish) drawFish(f);
  for (let f of purpleFish) drawPurpleFish(f);
  for (let m of mines) drawMine(m);

  drawExplosions(dt);

  if (hitLock <= 0 || Math.floor(t / 100) % 2 === 0) {
    drawFish(p, true);
  }

  updateInfo();

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillRect(0, 0, 900, 520);

    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.font = "bold 52px Arial";
    ctx.fillText("GAME OVER!", 450, 230);

    ctx.font = "bold 25px Arial";
    ctx.fillText("Điểm của bạn: " + score, 450, 280);

    ctx.font = "20px Arial";
    ctx.fillText("Nhấn nút CHƠI LẠI để tiếp tục", 450, 325);

    ctx.textAlign = "left";
  }

  raf = requestAnimationFrame(loop);
}

// Điều khiển bàn phím
window.addEventListener("keydown", e => {
  let k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k)) {
    e.preventDefault();
  }

  keys[k] = true;
});

window.addEventListener("keyup", e => {
  let k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
});

// Điều khiển chuột và cảm ứng
function getPointerPosition(e) {
  let rect = canvas.getBoundingClientRect();

  return {
    x: (e.clientX - rect.left) * canvas.width / rect.width,
    y: (e.clientY - rect.top) * canvas.height / rect.height
  };
}

canvas.addEventListener("pointerdown", e => {
  pointer = getPointerPosition(e);
});

canvas.addEventListener("pointermove", e => {
  if (e.buttons || e.pointerType === "touch") {
    pointer = getPointerPosition(e);
  }
});

canvas.addEventListener("pointerup", () => pointer = null);
canvas.addEventListener("pointerleave", () => pointer = null);
canvas.addEventListener("pointercancel", () => pointer = null);

// Bắt đầu game
restart();
</script>
</body>
</html>
