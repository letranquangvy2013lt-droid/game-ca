
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thế Giới Cá Mập 3D</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#031d36;color:white;
 font-family:Arial,sans-serif;text-align:center;
 overflow:hidden;
}
h1{
 margin:8px 0;color:#ffe77a;
 font-size:clamp(20px,4vw,32px);
 text-shadow:0 0 12px #00cfff;
}
#hud{
 display:flex;justify-content:center;gap:18px;
 flex-wrap:wrap;padding:7px;font-weight:bold;
 font-size:16px;
}
#game{
 display:block;width:100vw;height:calc(100vh - 125px);
 min-height:300px;
}
button{
 background:#ffcf35;border:0;border-radius:9px;
 padding:10px 20px;margin:3px;
 font-size:15px;font-weight:bold;cursor:pointer;
}
#message{
 position:fixed;inset:0;display:none;
 align-items:center;justify-content:center;
 flex-direction:column;background:#001b34bb;
 z-index:5;padding:20px;
}
#message h2{font-size:clamp(30px,7vw,55px);color:#ffe66b}
#message p{font-size:20px}
#controls{position:fixed;bottom:8px;left:0;right:0;z-index:2;pointer-events:none}
#controls button{pointer-events:auto}
#help{font-size:12px;color:#c9edff;margin:4px}
</style>
</head>
<body>

<h1>🦈 THẾ GIỚI CÁ MẬP 3D 🦈</h1>

<div id="hud">
 <span id="score">Điểm: 0</span>
 <span id="lives">Mạng: 4/4</span>
 <span id="size">Kích thước: 1</span>
 <span id="timer">Thời gian: 05:00</span>
</div>

<div id="game"></div>

<div id="controls">
 <button id="pauseButton" onclick="togglePause()">⏸️ TẠM DỪNG</button>
 <button onclick="restart()">🔄 CHƠI LẠI</button>
 <div id="help">Dùng WASD hoặc phím mũi tên để bơi. Ăn cá nhỏ để lớn lên!</div>
</div>

<div id="message">
 <h2 id="messageTitle"></h2>
 <p id="messageText"></p>
 <button onclick="restart()">🔄 CHƠI LẠI</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const game=document.getElementById("game");

if(!window.THREE){
 document.getElementById("message").style.display="flex";
 document.getElementById("messageTitle").textContent="Không tải được 3D";
 document.getElementById("messageText").textContent="Hãy kiểm tra kết nối Internet rồi tải lại trang.";
 throw new Error("Three.js chưa tải được");
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x087ca8);
scene.fog=new THREE.Fog(0x087ca8,35,110);

const camera=new THREE.PerspectiveCamera(65,1,0.1,200);
camera.position.set(0,8,15);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbceeff,0x17405b,2));

const sunlight=new THREE.DirectionalLight(0xffffff,2.2);
sunlight.position.set(-10,20,10);
sunlight.castShadow=true;
scene.add(sunlight);

const ocean=new THREE.Mesh(
 new THREE.PlaneGeometry(180,180,30,30),
 new THREE.MeshStandardMaterial({
  color:0x087da9,roughness:.8,
  metalness:.05,side:THREE.DoubleSide
 })
);
ocean.rotation.x=-Math.PI/2;
ocean.position.y=-9;
scene.add(ocean);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(180,180),
 new THREE.MeshStandardMaterial({color:0xc4ad68})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-11;
scene.add(floor);

function material(color,roughness=.65){
 return new THREE.MeshStandardMaterial({color,roughness});
}

const blue=material(0x687d89);
const belly=material(0xd7e3e7);
const black=material(0x111820);
const white=material(0xffffff);
const finMat=material(0x526773);

function makeFish(color=0xffa13b,size=1,shark=false){
 const group=new THREE.Group();
 const bodyMat=material(color);
 const body=new THREE.Mesh(
  new THREE.SphereGeometry(1,24,16),bodyMat
 );
 body.scale.set(1.3,.72,.62);
 group.add(body);

 const underside=new THREE.Mesh(
  new THREE.SphereGeometry(1,20,14),
  shark?belly:material(0xffd7a0)
 );
 underside.scale.set(1,.3,.54);
 underside.position.y=-.34;
 group.add(underside);

 const tail=new THREE.Mesh(
  new THREE.ConeGeometry(.48,.95,4),
  shark?finMat:bodyMat
 );
 tail.rotation.z=Math.PI/2;
 tail.position.x=-1.5;
 group.add(tail);

 const topFin=new THREE.Mesh(
  new THREE.ConeGeometry(.35,.85,4),
  shark?finMat:bodyMat
 );
 topFin.position.set(-.1,.85,0);
 topFin.rotation.z=-.15;
 group.add(topFin);

 for(const side of [-1,1]){
  const eye=new THREE.Mesh(
   new THREE.SphereGeometry(.12,12,10),white
  );
  eye.position.set(.75,.2,side*.52);
  group.add(eye);

  const pupil=new THREE.Mesh(
   new THREE.SphereGeometry(.06,10,8),black
  );
  pupil.position.set(.82,.2,side*.61);
  group.add(pupil);

  const fin=new THREE.Mesh(
   new THREE.ConeGeometry(.3,.7,4),
   shark?finMat:bodyMat
  );
  fin.position.set(-.25,-.45,side*.45);
  fin.rotation.x=side*.5;
  fin.rotation.z=.5;
  group.add(fin);
 }

 group.scale.setScalar(size);
 group.userData.tail=tail;
 return group;
}

const player=makeFish(0x718b9b,1,true);
scene.add(player);
player.position.set(0,0,0);

let fishes=[];
let mines=[];
let bigFishes=[];
let bubbles=[];
let fireworks=[];
let keys={};

let score=0;
let lives=4;
let size=1;
let timeLeft=300;
let paused=false;
let gameOver=false;
let victory=false;
let lastTime=0;
let invincible=0;
let animationId=0;

const clock=new THREE.Clock();

function random(min,max){
 return Math.random()*(max-min)+min;
}

function addSmallFish(){
 const colors=[0xffa13b,0xff69b4,0xffe45c,0x47e0c1,0xa58aff,0x55baff];
 const f=makeFish(colors[Math.floor(random(0,colors.length))],random(.35,.65));
 f.position.set(random(-38,38),random(-5,5),random(-38,38));
 f.userData.speed=random(2,4);
 f.userData.phase=random(0,7);
 scene.add(f);
 fishes.push(f);
}

function addBigFish(){
 const f=makeFish(0xa34be0,2.2);
 f.position.set(random(-35,35),random(-3,4),random(-35,35));
 f.userData.speed=random(1,2);
 f.userData.phase=random(0,7);
 scene.add(f);
 bigFishes.push(f);
}

function addMine(){
 const group=new THREE.Group();
 const ball=new THREE.Mesh(
  new THREE.SphereGeometry(.65,16,12),
  material(0x252d35)
 );
 group.add(ball);

 for(let i=0;i<8;i++){
  const spike=new THREE.Mesh(
   new THREE.ConeGeometry(.18,.65,8),
   material(0x171e25)
  );
  const a=i*Math.PI/4;
  spike.position.set(Math.cos(a)*.65,Math.sin(a)*.65,0);
  spike.rotation.z=a-Math.PI/2;
  group.add(spike);
 }
 group.position.set(random(-35,35),random(-5,5),random(-35,35));
 group.userData.phase=random(0,7);
 scene.add(group);
 mines.push(group);
}

function addBubble(){
 const b=new THREE.Mesh(
  new THREE.SphereGeometry(random(.06,.16),8,8),
  new THREE.MeshBasicMaterial({
   color:0xc5f6ff,transparent:true,opacity:.55
  })
 );
 b.position.set(random(-40,40),random(-8,8),random(-40,40));
 b.userData.speed=random(1,3);
 scene.add(b);
 bubbles.push(b);
}

function removeObject(array,index){
 scene.remove(array[index]);
 array.splice(index,1);
}

function updateHud(){
 document.getElementById("score").textContent="Điểm: "+score;
 document.getElementById("lives").textContent="Mạng: "+lives+"/4";
 document.getElementById("size").textContent="Kích thước: "+size.toFixed(1);
 const m=Math.floor(timeLeft/60);
 const s=Math.floor(timeLeft%60);
 document.getElementById("timer").textContent=
  "Thời gian: "+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function togglePause(){
 if(gameOver||victory)return;
 paused=!paused;
 document.getElementById("pauseButton").textContent=
  paused?"▶️ TIẾP TỤC":"⏸️ TẠM DỪNG";
}

function showEnd(title,text){
 document.getElementById("message").style.display="flex";
 document.getElementById("messageTitle").textContent=title;
 document.getElementById("messageText").textContent=text;
}

function createFireworks(){
 for(let i=0;i<100;i++){
  const particle=new THREE.Mesh(
   new THREE.SphereGeometry(.09,6,6),
   new THREE.MeshBasicMaterial({
    color:[0xffdd33,0xff66bb,0x55eeff,0xffffff][i%4]
   })
  );
  particle.position.copy(player.position);
  particle.position.x+=random(-8,8);
  particle.position.y+=random(-2,8);
  particle.position.z+=random(-8,8);
  particle.userData.life=random(1,3);
  particle.userData.velocity=new THREE.Vector3(
   random(-3,3),random(-1,4),random(-3,3)
  );
  scene.add(particle);
  fireworks.push(particle);
 }
}

function endVictory(){
 victory=true;
 createFireworks();
 showEnd("🏆 CHIẾN THẮNG! 🏆","Bạn đã sống sót đủ 5 phút! Điểm: "+score);
}

function endGame(){
 gameOver=true;
 showEnd("GAME OVER!","Bạn đã hết mạng. Điểm: "+score);
}

function restart(){
 cancelAnimationFrame(animationId);

 for(const f of [...fishes,...mines,...bigFishes,...bubbles,...fireworks]){
  scene.remove(f);
 }
 fishes=[];mines=[];bigFishes=[];bubbles=[];fireworks=[];

 score=0;lives=4;size=1;timeLeft=300;
 paused=false;gameOver=false;victory=false;invincible=0;
 keys={};
 player.scale.setScalar(1);
 player.position.set(0,0,0);
 player.rotation.set(0,0,0);

 for(let i=0;i<35;i++)addSmallFish();
 for(let i=0;i<5;i++)addBigFish();
 for(let i=0;i<15;i++)addMine();
 for(let i=0;i<45;i++)addBubble();

 document.getElementById("message").style.display="none";
 document.getElementById("pauseButton").textContent="⏸️ TẠM DỪNG";
 updateHud();
 lastTime=0;
 clock.start();
 animationId=requestAnimationFrame(loop);
}

function updatePlayer(dt){
 let dx=0,dy=0,dz=0;
 if(keys.ArrowUp||keys.w)dz-=1;
 if(keys.ArrowDown||keys.s)dz+=1;
 if(keys.ArrowLeft||keys.a)dx-=1;
 if(keys.ArrowRight||keys.d)dx+=1;
 if(keys.q)dy+=1;
 if(keys.e)dy-=1;

 const length=Math.hypot(dx,dy,dz);
 if(length>0){
  dx/=length;dy/=length;dz/=length;
  player.position.x+=dx*9*dt;
  player.position.y+=dy*9*dt;
  player.position.z+=dz*9*dt;

  if(dx!==0||dz!==0){
   player.rotation.y=Math.atan2(dx,dz);
  }
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-42,42);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-42,42);
 player.position.y=THREE.MathUtils.clamp(player.position.y,-7,7);

 player.scale.setScalar(size);
}

function updateCamera(dt){
 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+7,
  player.position.z+14
 );
 camera.position.lerp(target,Math.min(1,dt*3));
 camera.lookAt(player.position.x,player.position.y,player.position.z);
}

function updateObjects(dt,elapsed){
 for(let i=fishes.length-1;i>=0;i--){
  const f=fishes[i];
  f.position.x+=Math.sin(elapsed+f.userData.phase)*f.userData.speed*dt;
  f.position.z+=Math.cos(elapsed*.7+f.userData.phase)*f.userData.speed*dt;
  f.position.y+=Math.sin(elapsed*2+f.userData.phase)*.5*dt;
  f.rotation.y=Math.atan2(
   Math.cos(elapsed*.7+f.userData.phase),
   Math.sin(elapsed+f.userData.phase)
  );
  if(f.position.distanceTo(player.position)<size*.9+.7){
   score+=10;
   size=Math.min(5,size+.07);
   removeObject(fishes,i);
   addSmallFish();
  }
 }

 for(let i=bigFishes.length-1;i>=0;i--){
  const f=bigFishes[i];
  f.position.x+=Math.sin(elapsed*.5+f.userData.phase)*f.userData.speed*dt;
  f.position.z+=Math.cos(elapsed*.5+f.userData.phase)*f.userData.speed*dt;
  f.position.y+=Math.sin(elapsed+f.userData.phase)*.4*dt;

  if(f.position.distanceTo(player.position)<size*.9+2.2){
   if(size>2.5){
    score+=50;size=Math.min(5,size+.3);
    removeObject(bigFishes,i);addBigFish();
   }else{
    loseLife();
    f.position.set(random(-35,35),random(-5,5),random(-35,35));
   }
  }
 }

 for(const m of mines){
  m.rotation.x+=dt;
  m.rotation.y+=dt*.8;
  if(m.position.distanceTo(player.position)<size*.8+.65){
   if(invincible<=0){
    loseLife();
    m.position.set(random(-35,35),random(-5,5),random(-35,35));
   }
  }
 }

 for(const b of bubbles){
  b.position.y+=b.userData.speed*dt;
  if(b.position.y>9){
   b.position.y=-9;
   b.position.x=random(-40,40);
   b.position.z=random(-40,40);
  }
 }
}

function loseLife(){
 if(invincible>0)return;
 lives--;
 invincible=2;
 if(lives<=0){lives=0;endGame();}
}

function updateFireworks(dt){
 for(let i=fireworks.length-1;i>=0;i--){
  const f=fireworks[i];
  f.position.addScaledVector(f.userData.velocity,dt);
  f.userData.life-=dt;
  f.material.opacity=Math.max(0,f.userData.life/3);
  if(f.userData.life<=0){
   scene.remove(f);
   fireworks.splice(i,1);
  }
 }
}

function loop(now){
 animationId=requestAnimationFrame(loop);
 const dt=Math.min((now-(lastTime||now))/1000,.04);
 lastTime=now;

 if(!paused&&!gameOver&&!victory){
  timeLeft-=dt;
  if(timeLeft<=0){
   timeLeft=0;
   endVictory();
  }else{
   updatePlayer(dt);
   updateObjects(dt,now/1000);
   if(invincible>0)invincible-=dt;
  }
 }

 if(victory){
  updateFireworks(dt);
  if(fireworks.length<15)createFireworks();
 }

 updateCamera(dt);
 updateHud();

 if(invincible>0&&!victory&&!gameOver){
  player.visible=Math.floor(now/100)%2===0;
 }else player.visible=true;

 renderer.render(scene,camera);
}

window.addEventListener("keydown",e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 keys[k]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k))e.preventDefault();
});

window.addEventListener("keyup",e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 keys[k]=false;
});

function resize(){
 const w=game.clientWidth;
 const h=game.clientHeight;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}
window.addEventListener("resize",resize);
resize();

restart();
</script>
</body>
</html>
